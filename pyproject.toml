[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hearth-control"
version = "0.1.0"
description = "Private capability orchestration for a home compute farm"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "authlib>=1.6,<2",
  "cryptography>=44",
  "joserfc>=1.2,<2",
  "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
  "nemo-switchyard==0.2.0",
]

[dependency-groups]
appliance = [
    "pycdlib>=1.14,<2",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.11", "jsonschema>=4.23"]
knowledge = [
    "graphifyy==0.1.14",
]

[project.scripts]
hearth-api = "hearth.main:main"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/hearth"]

[tool.uv]
build-constraint-dependencies = ["maturin==1.15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
