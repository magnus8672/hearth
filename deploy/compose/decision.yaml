# Added by head.py only after explicit pinned preparation has completed.
services:
  decision:
    image: hearth-decision:0.1.0
    pull_policy: never
    network_mode: none
    user: '10001:10001'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 4
    mem_limit: 6g
    pids_limit: 128
    volumes:
      - ${HEARTH_DECISION_DIR:?}/checkpoint:/checkpoint:ro
      - ${HEARTH_DECISION_DIR:?}/socket:/run/hearth-decision
    environment:
      HEARTH_DECISION_MANIFEST: /checkpoint/manifest.json
      HEARTH_DECISION_THREADS: '4'
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/run/hearth-decision/decision.sock')); c.get('http://decision/v1/info').raise_for_status()"]
      interval: 30s
      timeout: 3s
      start_period: 120s
      retries: 3
  api:
    environment:
      HEARTH_DECISION_SOCKET: /run/hearth-decision/decision.sock
    volumes:
      - ${HEARTH_DECISION_DIR:?}/socket:/run/hearth-decision:ro
  user-api:
    environment:
      HEARTH_DECISION_SOCKET: /run/hearth-decision/decision.sock
    volumes:
      - ${HEARTH_DECISION_DIR:?}/socket:/run/hearth-decision:ro
